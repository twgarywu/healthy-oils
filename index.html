    <!-- JSON-LD 3: High-Search-Volume FAQPage Schema (直攻 Google 搜尋長尾問答大版位) -->

    {
      "@context": "https://schema.org",

        {
          "@type": "Question",
          "name": "亞麻仁油可以加熱炒菜嗎？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "不可以。黃金亞麻仁油的發煙點僅約 107°C，富含高度不飽和脂肪酸 Omega-3 (ALA)，一旦高溫加熱容易氧化變質產生致癌物與自由基。建議生飲、涼拌、拌入溫熱湯品或溫熱飯菜中食用最佳。"
          }
        },
        {
          "@type": "Question",
          "name": "苦茶油的發煙點是幾度？適合煎魚與高溫油炸嗎？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "低溫物理初榨的苦茶油發煙點高達 252°C，遠高於橄欖油（約 190°C）與沙拉油。苦茶油單元不飽和脂肪酸 Omega-9 高達 80% 以上，熱穩定性極高，煎魚、大火爆炒甚至短時間油炸皆不易起刺激性油煙與致癌聚合物。"
          }
        },
        {
          "@type": "Question",
          "name": "為什麼要選「不炒籽、第一道低溫初榨」的苦茶油？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "傳統傳統油行常透過高溫重度烘炒（炒籽）來提高出油率並掩蓋發霉種籽的霉味，但容易產生燥熱感與苯駢芘等有害物質。有米的日子堅持第一道物理冷壓，不炒籽、不加化學溶劑，保留苦茶油珍貴的山茶芝素與天然果香，口感溫潤順喉不鎖喉。"
          }
        },
        {
          "@type": "Question",
          "name": "亞麻仁油每天吃多少？早上空腹喝有好處嗎？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "成人日常保健建議每天攝取 10～15ml（約一湯匙）。早上空腹生飲一小匙，或加入無糖優格、燕麥粥中，可平衡外食過量的 Omega-6，協助撫平體內慢性發炎、維護血管健康與排便順暢。"
          }
        },
        {
          "@type": "Question",
          "name": "苦茶油小果與大果有什麼不同？哪一種比較好？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "小果油茶（細葉山茶）果實小、生長週期長、採摘難度高，但出油香氣清雅、單元不飽和脂肪酸含量更高、多酚活性極佳；大果油茶（普通油茶）產量大、果實大，但風味較濃烈。高品質精品苦茶油多優先選用高山成熟小果。"
          }
        },
        {
          "@type": "Question",
          "name": "亞麻仁油有點微苦是壞掉了嗎？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "高品質新鮮黃金亞麻仁籽初榨時，帶有淡淡堅果香氣與極微弱的植物多酚苦味，這是天然成分的正常表現。若聞起來有油漆味、刺鼻魚腥油耗味，才代表油脂已經酸敗氧化，不宜再食用。"
          }
        }
      ]
    }
